# Host nginx in front of Open WebUI (127.0.0.1:3000). Replace <SERVER_LAN_IP> / server_name.
# Switch to the 443 block once IT issues an internal certificate.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen <SERVER_LAN_IP>:80;
    server_name chatbot.itu.local;

    client_max_body_size 50m;               # admin document uploads
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;          # websockets (streaming, live updates)
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;                             # stream tokens as they are generated
        proxy_read_timeout 600s;                         # CPU answers can take minutes
    }
}

